[project]
name = "onestep-sql"
version = "0.1.0"
description = "Unified MySQL and PostgreSQL connector plugin for onestep."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "onestep>=1.9.0",
    "SQLAlchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
mysql = [
    "asyncmy>=0.2.10",
    "mysql-replication>=1.0.15",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]
all = [
    "asyncmy>=0.2.10",
    "mysql-replication>=1.0.15",
    "psycopg[binary]>=3.2.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.entry-points."onestep.resources"]
sql = "onestep_sql:register_resources"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onestep_sql"]

[tool.uv.sources]
onestep = { workspace = true }
