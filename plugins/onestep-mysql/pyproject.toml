[project]
name = "onestep-mysql"
version = "0.7.0"
description = "MySQL connector plugin for onestep."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "onestep>=1.7.3",
    "onestep-sql[mysql,sqlite]>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onestep_mysql"]

[tool.uv.sources]
onestep = { workspace = true }
onestep-sql = { workspace = true }
