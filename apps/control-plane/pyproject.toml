[project]
name = "onestep-control-plane"
version = "0.1.0a0"
description = "Control plane for OneStep runtime monitoring and telemetry ingestion."
authors = [
  { name = "miclon", email = "jcnd@163.com" }
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "alembic>=1.16.0",
  "cryptography>=49.0.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "onestep[yaml,mysql,postgres,rabbitmq,redis,sqs,kafka]>=1.7.1",
  "onestep-feishu-bitable>=0.1.3",
  "pydantic-settings>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "pyyaml>=6.0.3",
  # The "asyncio" extra declares greenlet unconditionally. SQLAlchemy's own
  # greenlet requirement is marker-gated on platform_machine values such as
  # "aarch64"/"x86_64"; macOS arm64 reports "arm64", so the marker never
  # matches there and AsyncSession would fail at runtime with
  # "ValueError: the greenlet library is required to use this function".
  "sqlalchemy[asyncio]>=2.0.36",
  "uvicorn>=0.34.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
# aiosqlite is the async driver for the sqlite test path. It is declared in both
# the "test" and "dev" extras because .github/workflows/control-plane.yml runs
# `uv sync --frozen --extra dev` and then the full backend suite, while
# .github/workflows/control-plane-contract.yml installs `--extra test`. It stays
# out of the default dependencies so the production image
# (`uv sync --frozen --no-dev`) does not ship a test-only driver.
test = [
  "aiosqlite>=0.20.0",
  "pytest>=8.4.0",
]
dev = [
  "aiosqlite>=0.20.0",
  "pytest>=8.4.0",
  "ruff>=0.13.0",
  "pyinstaller>=6.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/onestep_control_plane_api"]

[tool.hatch.build.targets.sdist]
include = [
  "/alembic.ini",
  "/README.md",
  "/pyproject.toml",
  "/backend/alembic",
  "/backend/src/onestep_control_plane_api",
  "/backend/tests",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
