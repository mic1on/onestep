[project]
name = "onestep"
version = "1.12.0a1"
description = "Async task runtime for queue, polling, schedule, and webhook workloads."
authors = [
    { name = "miclon", email = "jcnd@163.com" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["async", "queue", "scheduler", "tasks", "webhook", "worker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
control-plane = [
    "onestep-control-plane>=0.1.1",
]
yaml = [
    "PyYAML>=6.0",
]
mysql = [
    "onestep-sql[mysql]>=0.1.0",
]
postgres = [
    "onestep-sql[postgres]>=0.1.0",
]
sql = [
    "onestep-sql[mysql,postgres,sqlite]>=0.2.0",
]
sqlite = [
    "onestep-sql[sqlite]>=0.2.0",
]
rabbitmq = [
    "onestep-mq>=0.2.1",
]
redis = [
    "onestep-redis>=0.2.1",
]
sqs = [
    "onestep-sqs>=0.2.2",
]
cloudflare = [
    "onestep-cf-queues>=0.1.0",
]
kafka = [
    "onestep-kafka>=0.1.3; python_version >= '3.10'",
]
elasticsearch = [
    "onestep-elasticsearch>=0.1.0",
]
clickhouse = [
    "onestep-clickhouse>=0.1.0",
]
mongodb = [
    "onestep-mongodb>=0.1.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "PyYAML>=6.0",
]
integration = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "PyYAML>=6.0",
    "onestep-mq>=0.2.1",
    "onestep-redis>=0.2.1",
    "onestep-sql[mysql,postgres,sqlite]>=0.2.0",
    "onestep-sqs>=0.2.2",
    "onestep-cf-queues>=0.1.0",
    "onestep-kafka>=0.1.3; python_version >= '3.10'",
    "onestep-elasticsearch>=0.1.0",
    "onestep-clickhouse>=0.1.0",
    "onestep-mongodb>=0.1.0",
]
all = [
    "onestep-control-plane>=0.1.1",
    "PyYAML>=6.0",
    "onestep-mq>=0.2.1",
    "onestep-redis>=0.2.1",
    "onestep-sql[mysql,postgres,sqlite]>=0.2.0",
    "onestep-sqs>=0.2.2",
    "onestep-cf-queues>=0.1.0",
    "onestep-kafka>=0.1.3; python_version >= '3.10'",
    "onestep-elasticsearch>=0.1.0",
    "onestep-clickhouse>=0.1.0",
    "onestep-mongodb>=0.1.0",
]
dev = [
    "onestep-control-plane>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "PyYAML>=6.0",
    "onestep-mq>=0.2.1",
    "onestep-redis>=0.2.1",
    "onestep-sql[mysql,postgres,sqlite]>=0.2.0",
    "onestep-sqs>=0.2.2",
    "onestep-cf-queues>=0.1.0",
    "onestep-kafka>=0.1.3; python_version >= '3.10'",
    "onestep-elasticsearch>=0.1.0",
    "onestep-clickhouse>=0.1.0",
    "onestep-mongodb>=0.1.0",
]

[project.scripts]
onestep = "onestep.cli:main"

[tool.uv.workspace]
members = [
    "plugins/onestep-feishu-bitable",
    "plugins/onestep-control-plane",
    "plugins/onestep-rabbitmq",
    "plugins/onestep-redis",
    "plugins/onestep-mysql",
    "plugins/onestep-postgres",
    "plugins/onestep-sqs",
    "plugins/onestep-cf-queues",
    "plugins/onestep-elasticsearch",
    "plugins/onestep-clickhouse",
    "plugins/onestep-mongodb",
    "plugins/onestep-sql",
]

[tool.uv.sources]
onestep-mq = { workspace = true }
onestep-redis = { workspace = true }
onestep-sqs = { workspace = true }
onestep-cf-queues = { workspace = true }
onestep-control-plane = { workspace = true }
onestep-kafka = { path = "plugins/onestep-kafka" }
onestep-elasticsearch = { workspace = true }
onestep-clickhouse = { workspace = true }
onestep-mongodb = { workspace = true }
onestep-sql = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onestep"]

[tool.hatch.build.targets.sdist]
include = [
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/Makefile",
    "/deploy",
    "/docker-compose.integration.yml",
    "/example",
    "/pyproject.toml",
    "/scripts",
    "/src/onestep",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "integration: live infrastructure tests",
]
