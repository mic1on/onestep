name: Worker Agent

on:
  pull_request:
    paths:
      - ".github/workflows/work-agent.yml"
      - "apps/work-agent/**"
  push:
    branches:
      - main
    tags:
      - "worker-agent-v*"
    paths:
      - ".github/workflows/work-agent.yml"
      - "apps/work-agent/**"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the current onestep-worker-agent version to PyPI"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: worker-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/work-agent

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: apps/work-agent/uv.lock

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/worker-agent-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#worker-agent-v}"
          PROJECT_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$TAG_VERSION" = "$PROJECT_VERSION"

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check .

      - name: Build distributions
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Smoke-install wheel
        run: |
          uv venv .release-smoke
          uv pip install --python .release-smoke/bin/python dist/*.whl
          .release-smoke/bin/onestep-agent --help

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: work-agent-dist
          path: apps/work-agent/dist/*

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test-build
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/worker-agent-v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'true')
      }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: work-agent-dist
          path: apps/work-agent/dist

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: apps/work-agent/dist/
