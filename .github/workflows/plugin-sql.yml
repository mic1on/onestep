name: SQL Plugin

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/plugin-sql.yml"
      - "plugins/onestep-sql/**"
      - "src/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - ".github/workflows/plugin-sql.yml"
      - "plugins/onestep-sql/**"
      - "src/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the current onestep-sql version to PyPI"
        required: false
        default: false
        type: boolean
      version:
        description: "Optional expected plugin version, for example 0.1.0"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sql-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_PACKAGE: onestep-sql
  PLUGIN_PATH: plugins/onestep-sql
  PLUGIN_PYPROJECT: plugins/onestep-sql/pyproject.toml

jobs:
  test:
    name: Test plugin (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install plugin test dependencies
        run: uv sync --frozen --all-packages --extra test

      - name: Run plugin tests
        # canonical + shared contract suites, plus the MySQL execution unit
        # suites (run on sqlite, no database needed) that implement the
        # tracked-execution backend shipped in this plugin.
        run: uv run --all-packages python -m pytest -q tests/contract/test_onestep_sql_canonical.py tests/contract/test_onestep_sql_shared.py plugins/onestep-mysql/tests/test_mysql_execution_backend.py plugins/onestep-mysql/tests/test_mysql_execution_schema.py plugins/onestep-mysql/tests/test_mysql_execution_source.py

      - name: Build plugin distribution
        run: uv build --package "$PLUGIN_PACKAGE" --out-dir dist/plugin --sdist --wheel --clear

      - name: Check plugin metadata
        run: uvx twine check dist/plugin/*

  detect-version:
    name: Detect plugin version change
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.detect.outputs.current_version }}
      previous_version: ${{ steps.detect.outputs.previous_version }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect version change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          INPUT_PUBLISH_PYPI: ${{ github.event.inputs.publish_pypi || 'false' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          set -euo pipefail

          read_version() {
            python3 -c 'import pathlib, re, sys; text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"); match = re.search(r"(?m)^version\s*=\s*\"([^\"]+)\"", text); print(match.group(1) if match else sys.exit(f"project.version not found in {sys.argv[1]}"))' "$1"
          }

          CURRENT_VERSION="$(read_version "$PLUGIN_PYPROJECT")"
          PREVIOUS_VERSION=""
          SHOULD_PUBLISH=false
          PROJECT_EXISTS_ON_PYPI=false
          VERSION_EXISTS_ON_PYPI=false
          PYPI_STATUS=unknown

          PYPI_STATUS="$(python3 - "$CURRENT_VERSION" "$PLUGIN_PACKAGE" <<'PY'
          import json
          import socket
          import sys
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          package = sys.argv[2]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json", timeout=20) as response:
                  releases = json.load(response).get("releases", {})
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("missing-project")
                  raise SystemExit(0)
              print("unknown")
              raise SystemExit(0)
          except (TimeoutError, socket.timeout, urllib.error.URLError):
              print("unknown")
              raise SystemExit(0)
          print("version-exists" if releases.get(version) else "missing-version")
          PY
          )"

          if [ "$PYPI_STATUS" = "version-exists" ]; then
            PROJECT_EXISTS_ON_PYPI=true
            VERSION_EXISTS_ON_PYPI=true
          elif [ "$PYPI_STATUS" = "missing-version" ]; then
            PROJECT_EXISTS_ON_PYPI=true
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$PYPI_STATUS" = "unknown" ]; then
              echo "::notice::Could not determine PyPI status for $PLUGIN_PACKAGE. Skipping automatic publish on push; use workflow_dispatch with publish_pypi=true when PyPI is healthy."
            fi

            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              if git cat-file -e "$BEFORE_SHA:$PLUGIN_PYPROJECT" 2>/dev/null; then
                git show "$BEFORE_SHA:$PLUGIN_PYPROJECT" > /tmp/previous-plugin-pyproject.toml
                PREVIOUS_VERSION="$(read_version /tmp/previous-plugin-pyproject.toml)"
              fi
            fi

            if [ "$PYPI_STATUS" = "unknown" ]; then
              SHOULD_PUBLISH=false
            elif [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              SHOULD_PUBLISH=true
            elif [ "$VERSION_EXISTS_ON_PYPI" != "true" ]; then
              SHOULD_PUBLISH=true
            fi
          elif [ "$INPUT_PUBLISH_PYPI" = "true" ]; then
            if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Requested plugin version '$INPUT_VERSION' does not match current version '$CURRENT_VERSION'." >&2
              exit 1
            fi
            SHOULD_PUBLISH=true
          fi

          {
            echo "current_version=$CURRENT_VERSION"
            echo "previous_version=$PREVIOUS_VERSION"
            echo "should_publish=$SHOULD_PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "Current plugin version: $CURRENT_VERSION"
          echo "Previous plugin version: ${PREVIOUS_VERSION:-<none>}"
          echo "PyPI status: $PYPI_STATUS"
          echo "Project exists on PyPI: $PROJECT_EXISTS_ON_PYPI"
          echo "Version exists on PyPI: $VERSION_EXISTS_ON_PYPI"
          echo "Publish plugin: $SHOULD_PUBLISH"

  live-compatibility:
    name: Live MySQL ${{ matrix.mysql-version }} (${{ matrix.driver }}) execution
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # §11.3/§15.3: cover both MySQL 8.0 and 8.4 so the tracked-execution
        # dialect stays proven against both release lines (8.4 removed some
        # legacy defaults; §6 behaviour was verified identical on both).
        mysql-version: ["8.0", "8.4"]
        # Both drivers ship in onestep-sql's mysql extra and business code can
        # point ONESTEP_MYSQL_DSN at either; the live suite must prove the
        # tracked-execution backend (including the connect-event session
        # pinning) on the async-first asyncmy path, not only pymysql.
        driver: ["asyncmy", "pymysql"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: onestep
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      ONESTEP_MYSQL_DSN: mysql+${{ matrix.driver }}://root:root@127.0.0.1:3306/onestep

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run live MySQL execution tests
        # §11.3.1/§11.3.2: MySQL 8.x defaults to caching_sha2_password, which
        # needs `cryptography` on a plaintext-TCP first authentication. It is
        # declared in onestep-sql's `mysql`/`all` extras, so the frozen sync
        # below installs it; the import assert fails the job loudly if that
        # ever regresses, instead of relying on the healthcheck warming the
        # auth cache (a silent false-green per §11.3.2).
        #
        # Only the execution live suites run here: this job exists for the
        # tracked-execution capability of onestep-sql, and the binlog live
        # suite needs ROW-format server flags that GitHub service containers
        # cannot set (it is covered by the compose-based integration script
        # and the MySQL plugin workflow).
        #
        # ``test_mysql_live.py`` is included for its table-sink batch cases:
        # the multi-row ``AS new ON DUPLICATE KEY UPDATE`` rendering depends on
        # driver/server version behaviour, and the compose-based integration
        # job only exercises it through pymysql while production resolves
        # ``mysql://`` to asyncmy. This matrix covers both drivers on 8.0/8.4.
        # Its binlog case is deselected here (ROW format is unavailable in
        # service containers) and stays covered by the integration script.
        run: |
          uv sync --frozen --all-packages --extra test --extra mysql
          uv run --all-packages python -c "import cryptography; print('cryptography', cryptography.__version__)"
          uv run --all-packages python -m pytest -q -m integration plugins/onestep-mysql/tests/integration/test_mysql_execution_live.py plugins/onestep-mysql/tests/integration/test_mysql_execution_source_live.py
          uv run --all-packages python -m pytest -q -m integration plugins/onestep-mysql/tests/integration/test_mysql_live.py -k "table_sink"

      - name: Run batch correctness and packet-limit regressions
        env:
          # The service is isolated; each test restores the global value and
          # reconnects so its SESSION max_allowed_packet reflects that value.
          ONESTEP_TEST_ALLOW_GLOBAL_MYSQL_SETTINGS: "1"
        run: uv run --all-packages python -m pytest -q tests/contract/test_onestep_sql_batch_regressions.py

  publish-pypi:
    name: Publish plugin to PyPI
    runs-on: ubuntu-latest
    needs:
      - test
      - live-compatibility
      - detect-version
    if: >-
      ${{
        needs.test.result == 'success' &&
        needs.live-compatibility.result == 'success' &&
        needs.detect-version.outputs.should_publish == 'true'
      }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build plugin distribution
        run: uv build --package "$PLUGIN_PACKAGE" --out-dir dist/plugin --sdist --wheel --clear

      - name: Check plugin metadata
        run: uvx twine check dist/plugin/*

      - name: Verify onestep dependency is published
        run: |
          set -euo pipefail

          REQUIRED_ONESTEP_VERSION="$(
            python3 -c 'import pathlib, re, sys; text = pathlib.Path("plugins/onestep-sql/pyproject.toml").read_text(encoding="utf-8"); match = re.search(r"onestep\s*>=\s*([0-9]+(?:\.[0-9]+)*(?:[A-Za-z0-9._+-]*)?)", text); print(match.group(1) if match else sys.exit("onestep dependency must be pinned as onestep>=<version>"))'
          )"

          python3 -c 'import json, sys, urllib.request; version = sys.argv[1]; releases = json.load(urllib.request.urlopen("https://pypi.org/pypi/onestep/json", timeout=20)).get("releases", {}); sys.exit(f"onestep=={version} is not published on PyPI yet; publish the core package before publishing the plugin.") if not releases.get(version) else print(f"onestep=={version} is available on PyPI.")' "$REQUIRED_ONESTEP_VERSION"

      - name: Publish plugin to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/plugin
          skip-existing: true
